<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>마석중학교 학교 현황</title>
<meta name="theme-color" content="#3953a4">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="마석중">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--c:#3953a4;--c2:#eaeef9;--line:#e2e5ea;--bg:#f4f6f8}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:#222;font-size:15px}
button{font-family:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;gap:8px}
.title{font-weight:700;font-size:17px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.title img{width:30px;height:30px;border-radius:50%;background:#fff}
.top select{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.5)}
.top select option{color:#222}
.tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:50px;z-index:4}
.tabs button{flex:0 0 auto;border:0;background:none;padding:12px 14px;font-size:15px;color:#666;border-bottom:3px solid transparent}
.tabs button.on{color:var(--c);border-color:var(--c);font-weight:700}
main{padding:10px;max-width:1100px;margin:0 auto}
.chip{white-space:nowrap;border:1px solid #ccc;background:#fff;border-radius:18px;padding:7px 13px;font-size:14px;margin:3px;color:#333}
.chip.on{background:var(--c);color:#fff;border-color:var(--c)}
.chips{display:flex;flex-wrap:wrap;align-items:center}
.btn{background:var(--c);color:#fff;border:0;border-radius:10px;padding:10px 15px;font-size:15px;font-weight:700}
.btn.ghost{background:#e9edf1;color:#333}
.btn.danger{background:#fbe9e9;color:#c00}
.mini{border:1px solid #ccc;background:#fff;border-radius:8px;padding:5px 9px;font-size:13px;color:#333}
.top .mini{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.5)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.between{justify-content:space-between}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.stat{background:#fff;border-radius:10px;padding:10px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.stat small{color:#777;display:block;font-size:12px}.stat b{font-size:20px;color:var(--c)}
.tw{overflow-x:auto;border-radius:10px;margin-bottom:14px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06)}
table.t{border-collapse:collapse;font-size:14px;white-space:nowrap;width:100%}
.t th,.t td{border-bottom:1px solid #eef0f3;padding:8px 9px;text-align:center}
.t th{background:#f7f9fb;color:#555;position:sticky;top:0}
.t td.l,.t th.l{text-align:left}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:#f5f9fd}
.t tr.sub td{background:#f3f7fb;font-weight:700}
.t tr.tot td{background:var(--c2);font-weight:800}
.t td.wrap{white-space:normal;text-align:left;min-width:180px}
h3.sec{margin:16px 2px 8px;font-size:16px}
.hint{color:#777;font-size:13px;margin:6px 0;line-height:1.5}
.empty{color:#888;text-align:center;padding:26px 8px;line-height:1.8}
.bars{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.bars h4{margin:0 0 8px}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:14px}
.bar .n{width:110px;flex:0 0 110px;text-align:right;color:#444;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .g{flex:1;background:#eef2f6;border-radius:6px;height:22px;position:relative}
.bar .f{background:var(--c);height:100%;border-radius:6px;min-width:2px}
.bar .v{width:70px;flex:0 0 70px;font-weight:700;font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:14px 14px 28px}
.sheet h3{margin:4px 0 12px}
.frow{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.frow>label{min-width:80px;font-weight:600;color:#555;font-size:14px}
input,select,textarea{font-size:15px;padding:8px;border:1px solid #ccc;border-radius:8px;background:#fff;font-family:inherit}
.frow input{flex:1;min-width:120px}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.login{text-align:center;padding:70px 20px}.login .logo img{width:150px;height:150px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.18))}.login h2{color:var(--c);margin:18px 0 6px}
.badge{white-space:nowrap;background:#fff;color:var(--c);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700}
.tag{display:inline-block;background:var(--c2);color:var(--c);border-radius:6px;padding:1px 7px;margin:2px;font-size:13px}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:50;display:none}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:16px}}
@media print{.top,.tabs,.noprint,.btn,.mini{display:none !important}body{background:#fff}.card,.tw,.bars,.stat{box-shadow:none;border:1px solid #ddd}main{max-width:none}}

/* ================= 가독성 높이기 (태블릿용) ================= */
/* ① 글자 크게 */
body{font-size:17px;line-height:1.5}
.top{min-height:58px;padding:10px 16px}
.title{font-size:19px}.title img{width:34px;height:34px}
.top select{font-size:16px;padding:7px 10px}
table.t{font-size:16.5px}
.t th{font-size:15px;font-weight:700;color:#444}
.stat{padding:14px 10px}.stat small{font-size:14px}.stat b{font-size:28px}
.stats{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
h3.sec{font-size:19px;margin:22px 2px 10px}
.hint{font-size:15px}
.bar{font-size:16px;margin:8px 0}.bar .n{width:130px;flex-basis:130px}.bar .g{height:26px}.bar .v{width:84px;flex-basis:84px;font-size:15px}
.bars h4{font-size:17px;margin-bottom:12px}
.tag{font-size:15px;padding:3px 9px;margin:3px}
input,select,textarea{font-size:17px;padding:10px}
.frow>label{font-size:16px;min-width:100px}
/* ② 표를 시원하게: 줄 간격 넓히기 + 한 줄씩 옅은 색 */
.t th,.t td{padding:13px 14px;border-bottom:1px solid #e6e9ef}
.t tbody tr:nth-child(even):not(.sub):not(.tot) td{background:#f7f8fc}
.t tr.click:hover td{background:#eef3fb !important}
.t tr.sub td{background:#eef1f8;border-top:2px solid #d7dceb}
.t tr.tot td{background:var(--c2);border-top:2px solid var(--c)}
.t th{border-bottom:2px solid #d7dceb}
/* ③ 긴 내용은 아래로 줄바꿈 */
.t td.wrap{white-space:normal;min-width:260px;max-width:620px;line-height:1.6}
.tlist{margin:0;padding:0;list-style:none}
.tlist li{position:relative;padding:3px 0 3px 16px;border-bottom:1px dashed #e6e9ef}
.tlist li:last-child{border-bottom:0}
.tlist li:before{content:'';position:absolute;left:3px;top:13px;width:6px;height:6px;border-radius:50%;background:var(--c)}
/* ④ 메뉴·버튼 크게 (손가락으로 누르기 쉽게) */
.tabs{top:58px}
.tabs button{flex:1 0 auto;padding:16px 20px;font-size:17px;border-bottom-width:4px}
.chip{padding:10px 18px;font-size:16px;margin:4px;border-radius:22px}
.btn{padding:13px 20px;font-size:17px;border-radius:12px}
.mini{padding:8px 13px;font-size:15px;border-radius:10px}
/* ⑤ 학년별 색 */
:root{--g1:#2e9d5b;--g1b:#e6f5ec;--g2:#d9821b;--g2b:#fdf1e2;--g3:#8a4fc2;--g3b:#f3ecfb}
.gb{display:inline-block;min-width:54px;border-radius:8px;padding:3px 10px;font-weight:700;color:#fff}
.gb.g1{background:var(--g1)}.gb.g2{background:var(--g2)}.gb.g3{background:var(--g3)}
.t tr.r1 td:first-child{box-shadow:inset 6px 0 0 var(--g1)}
.t tr.r2 td:first-child{box-shadow:inset 6px 0 0 var(--g2)}
.t tr.r3 td:first-child{box-shadow:inset 6px 0 0 var(--g3)}
.t tr.sub.r1 td{background:var(--g1b)}.t tr.sub.r2 td{background:var(--g2b)}.t tr.sub.r3 td{background:var(--g3b)}
.tag.t1{background:var(--g1b);color:#1f6e40}.tag.t2{background:var(--g2b);color:#93560d}.tag.t3{background:var(--g3b);color:#5e3192}
.card.c1{border-left:6px solid var(--g1)}.card.c2{border-left:6px solid var(--g2)}.card.c3{border-left:6px solid var(--g3)}
.legend{display:flex;gap:14px;align-items:center;font-size:15px;color:#555;margin:4px 2px 10px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:5px;vertical-align:-2px}
@media print{.t tbody tr:nth-child(even) td{background:#fff}}
</style>
</head>
<body>
<div id="app"><div class="login"><div class="logo"><img src="logo.png" alt="마석중학교"></div><p class="empty">불러오는 중...</p></div></div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)App.closeM()"></div>
<div id="toast"></div>

<script type="module">
// =====================================================================
// ① 파이어베이스 설정 — 이 부분만 내 파이어베이스 값으로 바꾸면 됩니다.
//    (값을 안 바꾸면 "연습 모드"로 이 기기에만 저장됩니다)
// =====================================================================
const firebaseConfig = {
  apiKey: "AIzaSyAW4Jk8wYQXqEXYLVZTDwqcBFvyoFGTgt8",
  authDomain: "my-life-book-cbd51.firebaseapp.com",
  projectId: "my-life-book-cbd51",
  storageBucket: "my-life-book-cbd51.firebasestorage.app",
  messagingSenderId: "848175697980",
  appId: "1:848175697980:web:12951f517a5d7bb37e3339"
};
const SCHOOL = '마석중학교';

// 연결할 구글시트 주소 (「마석중학교 학교 현황 기초 자료」)
//  - 다른 시트로 바꾸려면 시트 주소를 통째로 붙여 넣어도 됩니다.
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1azre_7W8iuLcAHVGcbqTzf1GNfNbpHhRrRCtEu1zpzs/edit';
const SHEET_ID = (SHEET_URL.match(/\/d\/([\w-]+)/) || [,SHEET_URL])[1];
const SHEET_SKIP = ['안내'];   // 앱에 넣지 않을 탭 이름

// =====================================================================
// ② 표의 모양 (구글시트의 첫 줄 제목과 같게 맞춰 두었습니다)
//    [저장 이름, 화면 제목, 다른 이름들(붙여넣기 때 알아보는 제목), 숫자인지]
// =====================================================================
const SCHEMA = {
  teachers: {name:'교사', cols:[
    ['name','이름',['성명','교사','교사명'],0],
    ['gender','성별',[],0],
    ['birth','출생연도',['출생년도','생년','나이'],1],
    ['univ','출신대학',['대학','졸업대학','출신대학교'],0],
    ['subject','교과',['과목','담당교과'],0],
    ['role','직위',['직급','직책','구분'],0]]},
  classes: {name:'학급', cols:[
    ['grade','학년',[],1],
    ['cls','반',['학급'],1],
    ['homeroom','담임',['담임교사','담임교사성명','담임성명'],0],
    ['subhome','부담임',['부담임교사','부담임교사성명','부담임성명'],0],
    ['sem1','1학기 반장',['1학기반장','반장1학기','1학기'],0],
    ['sem2','2학기 반장',['2학기반장','반장2학기','2학기'],0],
    ['pledge','생활협약',['학급생활협약','급훈','학급목표'],0],
    ['note','특이사항',['비고','메모'],0],
    ['boys','남',['남학생','학생수남','남자'],1],
    ['girls','여',['여학생','학생수여','여자'],1]]},
  lessons: {name:'수업', cols:[
    ['teacher','교사',['이름','성명','교사명'],0],
    ['grade','학년',[],1],
    ['cls','반',['학급'],1],
    ['subject','교과',['과목'],0],
    ['hours','주당시수',['시수','시간','주당시간'],1]]},
  duties: {name:'업무', cols:[
    ['teacher','교사',['이름','성명','교사명'],0],
    ['dept','부서',['부서명','소속'],0],
    ['task','업무',['담당업무','업무내용'],0]]}
};
const KINDS = Object.keys(SCHEMA);
// 앱이 스스로 계산하는 칸은 붙여 넣어도 읽지 않습니다
const IGNORE = ['합계','계','총계','소계','학생수계','학생수합계','나이','연령'];

// =====================================================================
// ③ 앱 상태
// =====================================================================
const now = new Date();
const curSchoolYear = now.getMonth() < 2 ? now.getFullYear()-1 : now.getFullYear(); // 3월에 새 학년도
const S = {
  year: String(curSchoolYear), tab:'classes', D:empty(), user:null,
  lv:'teacher', dv:'teacher', cv:'table', imp:{kind:'teachers', text:'', mode:'replace', rows:null}, e:{},
  sync:null, gtoken:null, gtime:0
};
function empty(){ return {teachers:[], classes:[], lessons:[], duties:[], xcols:{}, custom:[]}; }

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const num = v => { const n = parseFloat(String(v??'').replace(/[^0-9.\-]/g,'')); return isNaN(n) ? 0 : n; };
const chip = (label,on,act) => `<button class="chip ${on?'on':''}" onclick="${act}">${esc(label)}</button>`;
const clsName = r => `${r.grade}-${r.cls}`;
// 학년별 색 (1학년 초록 · 2학년 주황 · 3학년 보라)
const gN = g => { const n = num(g); return n>=1 && n<=3 ? n : 0; };
const gBadge = r => `<span class="gb g${gN(r.grade)}">${esc(r.grade)}학년</span>`;
const legend = `<div class="legend"><span><i style="background:var(--g1)"></i>1학년</span><span><i style="background:var(--g2)"></i>2학년</span><span><i style="background:var(--g3)"></i>3학년</span></div>`;
// 업무 여러 개를 한 줄씩 목록으로
const tlist = arr => arr.length ? `<ul class="tlist">${arr.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>` : '';
const byClass = (a,b) => num(a.grade)-num(b.grade) || num(a.cls)-num(b.cls);
function toast(m){ const t=$('#toast'); t.textContent=m; t.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display='none',2300); }
function tbl(heads, rows, opts={}){
  return `<div class="tw"><table class="t"><thead><tr>${heads.map((h,i)=>`<th class="${(opts.left||[]).includes(i)?'l':''}">${h}</th>`).join('')}</tr></thead><tbody>${
    rows.length ? rows.join('') : `<tr><td colspan="${heads.length}" style="color:#999;padding:20px">자료가 없습니다. [자료 넣기] 탭에서 올려 주세요.</td></tr>`}</tbody></table></div>`;
}
// 시트에 직접 추가한 칸(앱이 모르는 칸)도 그대로 보관하고 보여 줍니다
const xh = kind => (S.D.xcols||{})[kind] || [];
const xth = kind => xh(kind).map(h=>esc(h));
const xtd = (kind,r) => xh(kind).map(h=>`<td>${esc((r.x||{})[h])}</td>`).join('');
// 업무 칸 "• 가 / 나 / 다" → [가, 나, 다]
const tasks = t => String(t||'').replace(/^[•·\-\s]+/,'').split(/\s*\/\s*/).map(x=>x.trim()).filter(Boolean);
// 교사 한 명에 대해 다른 탭에서 정보 모으기
function tinfo(name){
  const C = S.D.classes, L = S.D.lessons, U = S.D.duties;
  const home = C.filter(c=>c.homeroom===name).map(clsName);
  const sub = C.filter(c=>c.subhome===name).map(clsName);
  const hours = L.filter(l=>l.teacher===name).reduce((s,l)=>s+num(l.hours),0);
  const dept = [...new Set(U.filter(u=>u.teacher===name).map(u=>u.dept).filter(Boolean))].join(', ');
  return {home, sub, hours, dept};
}
const age = r => r.birth ? (Number(S.year) - num(r.birth)) : null;   // 그 학년도 기준 나이(만 나이와 1살 정도 차이 날 수 있음)

// =====================================================================
// ④ 저장하기 (학년도마다 한 묶음으로 저장)
// =====================================================================
const USE_FB = !firebaseConfig.apiKey.includes('여기에');
let fb = null;
const LS = 'maseok-school-v1';
const lsAll = () => { try{ return JSON.parse(localStorage.getItem(LS)||'{}'); }catch(e){ return {}; } };
async function loadYear(y){
  if (!USE_FB){ S.D = {...empty(), ...(lsAll()[y]||{})}; return; }
  const snap = await fb.F.getDoc(fb.F.doc(fb.db,'users',fb.uid,'years',y));
  S.D = {...empty(), ...(snap.exists() ? snap.data() : {})};
}
async function getYear(y){   // 다른 학년도 자료 읽기 (복사용)
  if (!USE_FB) return lsAll()[y] || null;
  const snap = await fb.F.getDoc(fb.F.doc(fb.db,'users',fb.uid,'years',y));
  return snap.exists() ? snap.data() : null;
}
function save(){
  const data = JSON.parse(JSON.stringify(S.D));
  if (!USE_FB){ const all = lsAll(); all[S.year] = data; try{ localStorage.setItem(LS, JSON.stringify(all)); }catch(e){} return; }
  fb.F.setDoc(fb.F.doc(fb.db,'users',fb.uid,'years',S.year), {...data, updated:Date.now()})
    .catch(e => { console.error(e); toast('저장 실패: 인터넷 연결을 확인하세요'); });
}
async function initFirebase(){
  const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [A0, A, F] = await Promise.all([import(V+'firebase-app.js'), import(V+'firebase-auth.js'), import(V+'firebase-firestore.js')]);
  const app = A0.initializeApp(firebaseConfig);
  let db; try { db = F.initializeFirestore(app,{localCache:F.persistentLocalCache()}); } catch(e){ db = F.getFirestore(app); }
  const auth = A.getAuth(app);
  fb = {db, auth, A, F};
  A.onAuthStateChanged(auth, async user => {
    if (user){ fb.uid = user.uid; S.user = user; $('#app').innerHTML = '<p class="empty">불러오는 중...</p>'; await loadYear(S.year); render(); }
    else { S.user = null; $('#app').innerHTML = `<div class="login"><div class="logo"><img src="logo.png" alt="마석중학교"></div><h2>${SCHOOL} 학교 현황</h2><p>구글 계정으로 로그인하세요.</p><button class="btn" onclick="App.login()">구글로 로그인</button></div>`; }
  });
}

// =====================================================================
// ⑤ 화면 그리기
// =====================================================================
const TABS = [['classes','학급 현황'],['lessons','수업 현황'],['teachers','교사 현황'],['duties','업무 현황'],['custom','기타 자료'],['import','자료 넣기']];
const YEARS = Array.from({length:7},(_,i)=>String(curSchoolYear-1+i));
function render(){
  $('#app').innerHTML = `
  <header class="top"><div class="title"><img src="logo.png" alt="">${SCHOOL} 학교 현황</div>
    <span>${USE_FB?'':'<span class="badge">연습 모드</span> '}<select onchange="App.setYear(this.value)">${YEARS.map(y=>`<option value="${y}" ${y===S.year?'selected':''}>${y}학년도</option>`).join('')}</select>
    ${USE_FB&&S.user?' <button class="mini" onclick="App.logout()">로그아웃</button>':''}</span></header>
  <nav class="tabs">${TABS.map(([k,n])=>`<button class="${S.tab===k?'on':''}" onclick="App.setTab('${k}')">${n}</button>`).join('')}</nav>
  <main>${VIEWS[S.tab]()}</main>`;
}
const printBtn = `<button class="mini noprint" onclick="window.print()">🖨 인쇄</button>`;
const bars = (title, pairs, unit='명') => {
  const max = Math.max(1, ...pairs.map(p=>p[1])); const tot = pairs.reduce((s,p)=>s+p[1],0);
  return `<div class="bars"><h4>${title}</h4>${pairs.length ? pairs.map(([n,v]) => `<div class="bar"><span class="n" title="${esc(n)}">${esc(n)}</span><span class="g"><span class="f" style="display:block;width:${v/max*100}%"></span></span><span class="v">${v}${unit} <small style="color:#888">${tot?Math.round(v/tot*100):0}%</small></span></div>`).join('') : '<p class="hint">자료 없음</p>'}</div>`;
};
const stat = (n,v) => `<div class="stat"><small>${n}</small><b>${v}</b></div>`;

const VIEWS = {
  // ----- 학급 현황 -----
  classes(){
    const L = [...S.D.classes].sort(byClass);
    const B = L.reduce((s,r)=>s+num(r.boys),0), G = L.reduce((s,r)=>s+num(r.girls),0);
    const rows = []; let g = null, gb = 0, gg = 0, gn = 0;
    const pad = xh('classes').map(()=>'<td></td>').join('');
    const subtotal = () => rows.push(`<tr class="sub r${gN(g)}"><td>${g}학년 계</td><td>${gn}학급</td><td></td><td></td><td></td><td></td><td>${gb}</td><td>${gg}</td><td>${gb+gg}</td>${pad}</tr>`);
    for (const r of L){
      if (g!==null && r.grade!==g){ subtotal(); gb=gg=gn=0; }
      g = r.grade; gn++; gb += num(r.boys); gg += num(r.girls);
      rows.push(`<tr class="click r${gN(r.grade)}" onclick="App.edit('classes','${r.id}')"><td>${gBadge(r)}</td><td>${esc(r.cls)}반</td><td>${esc(r.homeroom)}</td><td>${esc(r.subhome)}</td><td>${esc(r.sem1)}</td><td>${esc(r.sem2)}</td><td>${num(r.boys)}</td><td>${num(r.girls)}</td><td><b>${num(r.boys)+num(r.girls)}</b></td>${xtd('classes',r)}</tr>`);
    }
    if (L.length){ subtotal(); rows.push(`<tr class="tot"><td>합계</td><td>${L.length}학급</td><td></td><td></td><td></td><td></td><td>${B}</td><td>${G}</td><td>${B+G}</td>${pad}</tr>`); }
    return `<div class="stats">${stat('학급 수',L.length)}${stat('남학생',B)}${stat('여학생',G)}${stat('전체 학생',B+G)}${stat('학급당 평균',L.length?(Math.round((B+G)/L.length*10)/10):0)}</div>
    <div class="row between"><div class="chips noprint">${chip('표로 보기',S.cv==='table',"App.set('cv','table')")}${chip('학급 카드 (생활협약)',S.cv==='card',"App.set('cv','card')")}</div><span>${printBtn} <button class="btn noprint" onclick="App.add('classes')">+ 학급 추가</button></span></div>
    ${legend}
    ${S.cv==='card'
      ? `<div class="grid2">${L.map(r=>`<div class="card c${gN(r.grade)}" style="cursor:pointer" onclick="App.edit('classes','${r.id}')">
          <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:21px;color:var(--g${gN(r.grade)},var(--c))">${clsName(r)}</b><small>남 ${num(r.boys)} · 여 ${num(r.girls)} · 계 ${num(r.boys)+num(r.girls)}</small></div>
          <div class="hint" style="margin:6px 0">담임 <b>${esc(r.homeroom)}</b> · 부담임 ${esc(r.subhome)||'-'}</div>
          <div class="hint" style="margin:4px 0">반장 1학기 <b>${esc(r.sem1)||'-'}</b> · 2학기 <b>${esc(r.sem2)||'-'}</b></div>
          ${r.pledge?`<div style="background:var(--c2);border-radius:8px;padding:8px;margin-top:6px;white-space:pre-line">🤝 ${esc(r.pledge)}</div>`:''}
          ${r.note?`<div class="hint" style="margin-top:6px">📌 ${esc(r.note)}</div>`:''}
          ${xh('classes').filter(h=>(r.x||{})[h]).map(h=>`<div class="hint">${esc(h)}: ${esc(r.x[h])}</div>`).join('')}</div>`).join('')}</div>`
      : tbl(['학년','반','담임교사','부담임교사','1학기 반장','2학기 반장','남','여','계',...xth('classes')], rows)}
    <p class="hint noprint">줄을 누르면 고치거나 지울 수 있습니다.</p>`;
  },

  // ----- 수업 현황 -----
  lessons(){
    const L = S.D.lessons;
    const tot = L.reduce((s,r)=>s+num(r.hours),0);
    const views = [['teacher','교사별'],['class','학급별'],['subject','교과별'],['matrix','한눈에 표'],['list','전체 목록']];
    let body = '';
    if (S.lv==='teacher'){
      const m = {};
      for (const r of L){ const k = r.teacher||'(미정)'; (m[k] = m[k]||[]).push(r); }
      const order = S.D.teachers.map(t=>t.name);
      const keys = Object.keys(m).sort((a,b)=> (order.indexOf(a)<0?999:order.indexOf(a)) - (order.indexOf(b)<0?999:order.indexOf(b)) || a.localeCompare(b,'ko'));
      const rows = keys.map(k => { const list = m[k].sort(byClass); const h = list.reduce((s,r)=>s+num(r.hours),0);
        const subj = [...new Set(list.map(r=>r.subject).filter(Boolean))].join(', ');
        return `<tr><td class="l"><b>${esc(k)}</b></td><td>${esc(subj)}</td><td class="wrap">${list.map(r=>`<span class="tag t${gN(r.grade)}">${clsName(r)} ${esc(r.subject||'')} ${num(r.hours)}</span>`).join('')}</td><td><b>${h}</b></td></tr>`; });
      if (keys.length) rows.push(`<tr class="tot"><td class="l">합계</td><td>${keys.length}명</td><td></td><td>${tot}</td></tr>`);
      body = tbl(['교사','교과','담당 학급 (학급 과목 시수)','주당 시수'], rows, {left:[0]});
    }
    if (S.lv==='class'){
      const m = {};
      for (const r of L){ const k = clsName(r); (m[k] = m[k]||{grade:r.grade,cls:r.cls,list:[]}).list.push(r); }
      const keys = Object.values(m).sort(byClass);
      const rows = keys.map(c => { const h = c.list.reduce((s,r)=>s+num(r.hours),0);
        return `<tr class="r${gN(c.grade)}"><td><b>${clsName(c)}</b></td><td class="wrap">${c.list.map(r=>`<span class="tag">${esc(r.subject||'')} ${num(r.hours)} (${esc(r.teacher)})</span>`).join('')}</td><td><b>${h}</b></td></tr>`; });
      body = tbl(['학급','과목별 시수 (교사)','주당 시수'], rows);
    }
    if (S.lv==='subject'){
      const m = {}; L.forEach(r=>{ const k=r.subject||'(미정)'; (m[k]=m[k]||{h:0,t:new Set(),c:new Set()}); m[k].h+=num(r.hours); m[k].t.add(r.teacher); m[k].c.add(clsName(r)); });
      const pairs = Object.entries(m).sort((a,b)=>b[1].h-a[1].h);
      body = bars('교과별 주당 시수', pairs.map(([k,v])=>[k,v.h]), '시간') +
        tbl(['교과','주당 시수','교사 수','학급 수','담당 교사'], pairs.map(([k,v])=>`<tr><td class="l"><b>${esc(k)}</b></td><td>${v.h}</td><td>${v.t.size}</td><td>${v.c.size}</td><td class="wrap">${[...v.t].map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</td></tr>`), {left:[0]});
    }
    if (S.lv==='matrix'){
      const classes = [...new Map(L.map(r=>[clsName(r),{grade:r.grade,cls:r.cls}])).values()].sort(byClass);
      const teachers = [...new Set(L.map(r=>r.teacher))];
      const cell = (t,c) => L.filter(r=>r.teacher===t && clsName(r)===clsName(c)).reduce((s,r)=>s+num(r.hours),0);
      const rows = teachers.map(t => `<tr><td class="l"><b>${esc(t)}</b></td>${classes.map(c=>{const v=cell(t,c);return `<td>${v||''}</td>`;}).join('')}<td><b>${L.filter(r=>r.teacher===t).reduce((s,r)=>s+num(r.hours),0)}</b></td></tr>`);
      if (teachers.length) rows.push(`<tr class="tot"><td class="l">학급 계</td>${classes.map(c=>`<td>${L.filter(r=>clsName(r)===clsName(c)).reduce((s,r)=>s+num(r.hours),0)}</td>`).join('')}<td>${tot}</td></tr>`);
      body = tbl(['교사 \\ 학급', ...classes.map(c=>`<span class="gb g${gN(c.grade)}" style="min-width:0">${clsName(c)}</span>`), '계'], rows, {left:[0]});
    }
    if (S.lv==='list'){
      const rows = [...L].sort((a,b)=>(a.teacher||'').localeCompare(b.teacher||'','ko')||byClass(a,b))
        .map(r=>`<tr class="click r${gN(r.grade)}" onclick="App.edit('lessons','${r.id}')"><td class="l">${esc(r.teacher)}</td><td>${clsName(r)}</td><td>${esc(r.subject)}</td><td>${num(r.hours)}</td>${xtd('lessons',r)}</tr>`);
      body = `<div class="row noprint"><button class="btn" onclick="App.add('lessons')">+ 수업 추가</button></div>` + tbl(['교사','학급','교과','주당 시수',...xth('lessons')], rows, {left:[0]});
    }
    return `<div class="stats">${stat('수업 줄 수',L.length)}${stat('주당 총 시수',tot)}${stat('수업 교사',new Set(L.map(r=>r.teacher)).size+'명')}</div>
    <div class="row between noprint"><div class="chips">${views.map(([k,n])=>chip(n,S.lv===k,`App.set('lv','${k}')`)).join('')}</div>${printBtn}</div>${S.lv==='subject'?'':legend}${body}`;
  },

  // ----- 교사 현황 -----
  teachers(){
    const L = S.D.teachers;
    const M = L.filter(r=>r.gender==='남').length, W = L.filter(r=>r.gender==='여').length;
    const ages = L.map(age).filter(a=>a!=null && a>0);
    const avg = ages.length ? Math.round(ages.reduce((s,a)=>s+a,0)/ages.length*10)/10 : '-';
    const band = a => a<30?'20대':a<40?'30대':a<50?'40대':a<60?'50대':'60대 이상';
    const bandPairs = ['20대','30대','40대','50대','60대 이상'].map(b=>[b, ages.filter(a=>band(a)===b).length]);
    const univ = {}; L.forEach(r=>{ const u = (r.univ||'(미입력)').trim(); univ[u]=(univ[u]||0)+1; });
    const univPairs = Object.entries(univ).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ko'));
    const subj = {}; L.forEach(r=>{ const u = (r.subject||'(미입력)').trim(); subj[u]=(subj[u]||0)+1; });
    const subjPairs = Object.entries(subj).sort((a,b)=>b[1]-a[1]);
    const rows = [...L].map(r=>{ const t = tinfo(r.name);
      return `<tr class="click" onclick="App.edit('teachers','${r.id}')"><td class="l"><b>${esc(r.name)}</b></td><td>${esc(r.gender)}</td><td>${age(r)??''}</td><td>${esc(r.univ)}</td><td>${esc(r.subject)}</td><td>${esc(r.role)}</td><td>${t.home.join(', ')}</td><td>${t.sub.join(', ')}</td><td>${esc(t.dept)}</td><td>${t.hours||''}</td>${xtd('teachers',r)}</tr>`; });
    const roleG = r => /기간제/.test(r.role||'') ? '기간제 교사' : /교장|교감/.test(r.role||'') ? '교장·교감' : (r.role ? '정규 교사' : '(미입력)');
    const rp = {}; L.forEach(r=>{ const k=roleG(r); rp[k]=(rp[k]||0)+1; });
    const rolePairs = ['교장·교감','정규 교사','기간제 교사','(미입력)'].filter(k=>rp[k]).map(k=>[k,rp[k]]);
    return `<div class="stats">${stat('전체 교사',L.length+'명')}${stat('남',M+'명')}${stat('여',W+'명')}${stat('평균 나이',avg)}</div>
    <div class="row between noprint"><b>${S.year}학년도 교사 현황</b><span>${printBtn} <button class="btn" onclick="App.add('teachers')">+ 교사 추가</button></span></div>
    <div class="grid2">${bars('성별',[['남',M],['여',W]])}${bars('연령별',bandPairs)}</div>
    <div class="grid2">${bars('직위별',rolePairs)}${bars('교과별',subjPairs)}</div>
    <div class="grid2">${bars('출신대학별',univPairs)}</div>
    <h3 class="sec">교사 명단</h3>
    ${tbl(['이름','성별','나이','출신대학','교과','직위','담임','부담임','부서','주당시수',...xth('teachers')], rows, {left:[0]})}
    <p class="hint">담임·부담임은 학급 탭, 부서는 업무 탭, 주당시수는 수업 탭에서 자동으로 가져옵니다.</p>
    <p class="hint">나이는 ${S.year}년 − 출생연도로 계산합니다 (생일에 따라 만 나이와 1살 차이가 날 수 있습니다).</p>`;
  },

  // ----- 업무 현황 -----
  duties(){
    const L = S.D.duties;
    const views = [['teacher','교사별'],['dept','부서별'],['list','전체 목록']];
    let body = '';
    if (S.dv==='teacher'){
      const m = {}; L.forEach(r=>{ const k=r.teacher||'(미정)'; (m[k]=m[k]||[]).push(r); });
      const order = S.D.teachers.map(t=>t.name);
      const keys = Object.keys(m);   // 시트 순서(부서 순) 그대로
      body = tbl(['교사','부서','담당 업무','업무 수'], keys.map(k=>{ const T = m[k].flatMap(r=>tasks(r.task));
        return `<tr><td class="l"><b>${esc(k)}</b></td><td>${esc([...new Set(m[k].map(r=>r.dept).filter(Boolean))].join(', '))}</td><td class="wrap">${tlist(T)}</td><td><b>${T.length}</b></td></tr>`; }), {left:[0]});
    }
    if (S.dv==='dept'){
      const m = {}; L.forEach(r=>{ const k=r.dept||'(부서 미정)'; (m[k]=m[k]||[]).push(r); });
      body = bars('부서별 인원', Object.entries(m).map(([d,l])=>[d,new Set(l.map(r=>r.teacher)).size])) +
        Object.entries(m).map(([d,list]) => `<h3 class="sec">${esc(d)} <small style="color:#888">${new Set(list.map(r=>r.teacher)).size}명 · 업무 ${list.flatMap(r=>tasks(r.task)).length}개</small></h3>`
        + tbl(['교사','업무'], list.map(r=>`<tr><td class="l"><b>${esc(r.teacher)}</b></td><td class="wrap">${tlist(tasks(r.task))}</td></tr>`), {left:[0]})).join('') || tbl(['교사','업무'],[]);
    }
    if (S.dv==='list'){
      body = `<div class="row noprint"><button class="btn" onclick="App.add('duties')">+ 업무 추가</button></div>` +
        tbl(['교사','부서','업무',...xth('duties')], L.map(r=>`<tr class="click" onclick="App.edit('duties','${r.id}')"><td class="l">${esc(r.teacher)}</td><td>${esc(r.dept)}</td><td class="wrap">${tlist(tasks(r.task))}</td>${xtd('duties',r)}</tr>`), {left:[0]});
    }
    return `<div class="stats">${stat('업무 항목',L.flatMap(r=>tasks(r.task)).length)}${stat('부서 수',new Set(L.map(r=>r.dept).filter(Boolean)).size)}${stat('담당 교사',new Set(L.map(r=>r.teacher)).size+'명')}</div>
    <div class="row between noprint"><div class="chips">${views.map(([k,n])=>chip(n,S.dv===k,`App.set('dv','${k}')`)).join('')}</div>${printBtn}</div>${body}`;
  },

  // ----- 기타 자료 (시트에 새로 만든 탭) -----
  custom(){
    const C = S.D.custom || [];
    if (!C.length) return `<p class="empty">아직 없습니다.<br>구글시트에 새 탭을 만들었다면 [자료 넣기] → <b>+ 새 표</b>로 넣으세요.<br>표 이름과 칸 제목은 시트 그대로 보여 줍니다.</p>`;
    return `<div class="row between noprint"><div class="chips">${C.map(c=>`<a href="#c_${c.id}" class="chip" style="text-decoration:none">${esc(c.name)} (${c.rows.length})</a>`).join('')}</div>${printBtn}</div>` +
      C.map(c => `<h3 class="sec" id="c_${c.id}">${esc(c.name)} <small style="color:#888">${c.rows.length}줄</small> <button class="mini noprint" onclick="App.delCustom('${c.id}')">지우기</button></h3>
      ${tbl(c.cols.map(esc), c.rows.map(r=>`<tr>${c.cols.map((_,i)=>`<td>${esc(r.c[i])}</td>`).join('')}</tr>`), {left:[0]})}`).join('');
  },

  // ----- 자료 넣기 -----
  import(){
    const I = S.imp, sc = SCHEMA[I.kind] || {name:'새 표', cols:[]};
    let prev = '';
    if (I.kind==='custom' && I.rows && I.rows.custom){
      const t = I.rows.custom;
      prev = `<h3 class="sec">미리 보기 · ${t.rows.length}줄 · 칸 ${t.cols.length}개</h3>${tbl(t.cols.map(esc), t.rows.slice(0,50).map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`))}
      <div class="btns"><button class="btn" onclick="App.impSave()">이 표 저장하기</button></div>`;
    } else if (I.rows){
      const ok = I.rows.filter(r=>!r._err);
      prev = `<h3 class="sec">미리 보기 · ${ok.length}줄${I.rows.length>ok.length?` · <span style="color:#c00">오류 ${I.rows.length-ok.length}줄</span>`:''}</h3>
      ${(I.rows.extras||[]).length?`<p class="hint">➕ 시트에 추가한 칸도 함께 저장합니다: <b>${I.rows.extras.map(esc).join(', ')}</b></p>`:''}
      ${tbl(sc.cols.map(c=>c[1]).concat(I.rows.extras||[]).concat(['확인']), I.rows.slice(0,200).map(r=>`<tr>${sc.cols.map(c=>`<td>${esc(r[c[0]])}</td>`).join('')}${(I.rows.extras||[]).map(h=>`<td>${esc(r.x[h])}</td>`).join('')}<td style="color:${r._err?'#c00':'#2a9d55'}">${r._err?esc(r._err):'✓'}</td></tr>`))}
      ${I.rows.length>200?'<p class="hint">200줄까지만 미리 보여 줍니다.</p>':''}
      <div class="btns">${ok.length?`<button class="btn" onclick="App.impSave()">${I.mode==='replace'?`${sc.name} 자료를 이것으로 바꾸기`:`${ok.length}줄 이어서 추가하기`}</button>`:''}</div>`;
    }
    const Y = S.sync;

// =====================================================================
// ⑥ 붙여넣기 읽기
// =====================================================================
// 구글시트에서 복사한 글 읽기 (칸 안에 줄바꿈·따옴표가 있어도 됨)
function parseTSV(text){
  text = text.replace(/\r/g,'');
  const sep = text.includes('\t') ? '\t' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i=0;i<text.length;i++){
    const ch = text[i];
    if (q){
      if (ch==='"'){ if (text[i+1]==='"'){ cur+='"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch==='"' && cur==='') q = true;
    else if (ch===sep){ row.push(cur); cur=''; }
    else if (ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur += ch;
  }
  if (cur!=='' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(v => String(v).trim()));
}
const norm = s => String(s||'').replace(/[\s()\[\]·:.\-_/]/g,'').trim();
function parsePaste(text, kind){ return parseLines(parseTSV(text), kind); }
// 줄 목록(시트에서 바로 읽어 온 것 또는 붙여 넣은 것)을 앱 자료로 바꾸기
function parseLines(lines, kind){
  const sc = SCHEMA[kind];
  lines = (lines||[]).map(l => l.map(v => String(v??''))).filter(r => r.some(v => v.trim()));
  if (!lines.length) return [];
  const split = l => l;                      // 이미 칸별로 나뉘어 있음
  let head = lines[0].map(norm);
  // 제목 줄에서 각 칸이 무엇인지 찾기
  const raw = lines[0].map(h=>String(h).trim());
  let map = head.map(h => { const c = sc.cols.find(c => norm(c[1])===h || c[2].map(norm).includes(h)); return c ? c[0] : null; });
  const extras = [];
  if (map.filter(Boolean).length >= 2){
    lines = lines.slice(1);
    map = map.map((k,i) => { if (k) return k; if (!raw[i] || IGNORE.includes(head[i])) return null; extras.push(raw[i]); return 'x:'+raw[i]; });
  } else map = sc.cols.map(c=>c[0]);        // 제목 줄이 없으면 정해진 순서대로
  const out = lines.map(l => {
    const v = split(l), r = {id:uid(), x:{}};
    map.forEach((k,i) => { if (!k) return; const val = (v[i]??'').trim(); if (k.startsWith('x:')) r.x[k.slice(2)] = val; else r[k] = val; });
    sc.cols.forEach(([k,,,isNum]) => {
      if (r[k]===undefined) r[k] = '';
      if (isNum && r[k]!=='') r[k] = String(num(r[k]));
    });
    if (kind==='teachers' && r.gender){ r.gender = /남|M/i.test(r.gender) ? '남' : /여|F|W/i.test(r.gender) ? '여' : r.gender; }
    if (kind==='teachers' && r.birth && num(r.birth)<100 && num(r.birth)>15) r.birth = String(Number(S.year)-num(r.birth)); // 나이를 적었으면 출생연도로
    if (kind==='classes' || kind==='lessons'){ r.grade = String(num(r.grade)||r.grade); r.cls = String(num(r.cls)||r.cls); }
    const need = {teachers:['name'], classes:['grade','cls'], lessons:['teacher','grade','cls'], duties:['teacher','task']}[kind];
    const miss = need.filter(k=>!r[k]).map(k=>sc.cols.find(c=>c[0]===k)[1]);
    if (miss.length) r._err = miss.join('·')+' 없음';
    return r;
  }).filter(r => sc.cols.some(c => r[c[0]]));
  out.extras = extras;
  return out;
}
// 새 표(기타 자료): 첫 줄을 제목으로 그대로 읽기
function parseCustom(text){
  const lines = parseTSV(text);
  if (!lines.length) return null;
  const cols = lines[0].map(h=>String(h).trim());
  const rows = lines.slice(1).map(v => cols.map((_,i)=>String(v[i]??'').trim())).filter(r=>r.some(Boolean));
  return {cols, rows};
}

// =====================================================================
// ⑥-2 구글시트에서 바로 불러오기
//    내 구글 계정으로 한 번 더 허락을 받아(읽기만 가능) 시트를 읽습니다.
//    시트를 인터넷에 공개하지 않아도 됩니다.
// =====================================================================
const SHEET_SCOPE = 'https://www.googleapis.com/auth/spreadsheets.readonly';
async function sheetToken(){
  if (S.gtoken && Date.now() - S.gtime < 50*60*1000) return S.gtoken;   // 50분 안에는 다시 묻지 않음
  const p = new fb.A.GoogleAuthProvider();
  p.addScope(SHEET_SCOPE);
  if (S.user && S.user.email) p.setCustomParameters({login_hint: S.user.email});
  const res = await fb.A.signInWithPopup(fb.auth, p);
  const cred = fb.A.GoogleAuthProvider.credentialFromResult(res);
  if (!cred || !cred.accessToken) throw new Error('구글 허락을 받지 못했습니다');
  S.gtoken = cred.accessToken; S.gtime = Date.now();
  return S.gtoken;
}
async function sheetGet(path, token){
  const r = await fetch('https://sheets.googleapis.com/v4/spreadsheets/' + SHEET_ID + path, {headers:{Authorization:'Bearer '+token}});
  if (!r.ok){
    let msg = ''; try{ msg = (await r.json()).error.message; }catch(e){}
    if (r.status===401) S.gtoken = null;
    const why = {401:'허락 시간이 지났습니다. 한 번 더 눌러 주세요.',
                 403:'시트를 읽을 권한이 없습니다. 시트 주인 계정으로 로그인했는지, 구글 클라우드에서 Google Sheets API를 켰는지 확인하세요.',
                 404:'시트를 찾을 수 없습니다. SHEET_URL 주소를 확인하세요.'}[r.status];
    throw new Error(why || ('오류 '+r.status+' '+msg));
  }
  return r.json();
}
async function readSheet(){
  const token = await sheetToken();
  const meta = await sheetGet('?fields=properties.title,sheets.properties.title', token);
  const titles = meta.sheets.map(s=>s.properties.title).filter(t=>!SHEET_SKIP.includes(t));
  const q = titles.map(t=>'ranges='+encodeURIComponent("'"+t.replace(/'/g,"''")+"'")).join('&');
  const data = await sheetGet('/values:batchGet?majorDimension=ROWS&valueRenderOption=FORMATTED_VALUE&'+q, token);
  const byName = {}; KINDS.forEach(k => byName[SCHEMA[k].name] = k);
  const tabs = [], custom = [];
  data.valueRanges.forEach((vr,i) => {
    const title = titles[i], lines = vr.values || [];
    const kind = byName[title];
    if (kind){
      const rows = parseLines(lines, kind);
      tabs.push({kind, title, rows, ok: rows.filter(r=>!r._err), bad: rows.filter(r=>r._err)});
    } else {
      const L = lines.map(l=>l.map(v=>String(v??'').trim())).filter(r=>r.some(Boolean));
      if (L.length > 1){
        const cols = L[0];
        custom.push({name:title, cols, rows: L.slice(1).map(v => cols.map((_,j)=>v[j]??''))});
      }
    }
  });
  return {file: meta.properties.title, tabs, custom, time: new Date()};
}

function openM(html){ const m=$('#modal'); m.classList.remove('hidden'); m.innerHTML=`<div class="sheet">${html}</div>`; }
function editM(){
  const {kind, r, isNew} = S.e, sc = SCHEMA[kind];
  const field = ([k,label,,isNum]) => {
    if (k==='gender') return `<div class="frow"><label>${label}</label><div class="chips">${['남','여'].map(g=>chip(g,r.gender===g,`App.eset('gender','${g}',true)`)).join('')}</div></div>`;
    const list = (k==='teacher'||k==='homeroom') ? `list="tlist"` : '';
    return `<div class="frow"><label>${label}</label><input ${isNum?'inputmode="numeric"':''} ${list} value="${esc(r[k])}" oninput="App.eset('${k}',this.value)"></div>`;
  };
  r.x = r.x || {};
  const xf = xh(kind).map((h,i) => `<div class="frow"><label>${esc(h)}</label><input value="${esc(r.x[h])}" oninput="App.ex(${i},this.value)"></div>`).join('');
  return `<h3>${sc.name} ${isNew?'추가':'고치기'}</h3>${sc.cols.map(field).join('')}${xf}
  <datalist id="tlist">${S.D.teachers.map(t=>`<option value="${esc(t.name)}">`).join('')}</datalist>
  <div class="btns"><button class="btn" onclick="App.esave()">저장</button><button class="btn ghost" onclick="App.closeM()">취소</button>${isNew?'':'<button class="btn danger" onclick="App.edel()">삭제</button>'}</div>`;
}

window.App = {
  async login(){
    try { await fb.A.signInWithPopup(fb.auth, new fb.A.GoogleAuthProvider()); }
    catch(e){ if (e.code!=='auth/popup-closed-by-user'){ try{ await fb.A.signInWithRedirect(fb.auth, new fb.A.GoogleAuthProvider()); }catch(e2){ toast('로그인 실패: '+e2.code); } } }
  },
  logout(){ if (confirm('로그아웃할까요?')) fb.A.signOut(fb.auth); },
  async setYear(y){ S.year = y; $('main') && ($('main').innerHTML = '<p class="empty">불러오는 중...</p>'); await loadYear(y); S.imp.rows = null; render(); },
  setTab(t){ S.tab = t; render(); window.scrollTo(0,0); },
  set(k,v){ S[k] = v; render(); },
  closeM(){ $('#modal').classList.add('hidden'); $('#modal').innerHTML=''; },

  add(kind){ const r = {id:uid()}; SCHEMA[kind].cols.forEach(c=>r[c[0]]=''); S.e = {kind, r, isNew:true}; openM(editM()); },
  edit(kind,id){ S.e = {kind, r:{...S.D[kind].find(x=>x.id===id)}, isNew:false}; openM(editM()); },
  eset(k,v,redraw){ S.e.r[k] = v; if (redraw) openM(editM()); },
  ex(i,v){ S.e.r.x = S.e.r.x||{}; S.e.r.x[xh(S.e.kind)[i]] = v; },
  esave(){
    const {kind, r, isNew} = S.e, list = S.D[kind];
    SCHEMA[kind].cols.forEach(([k,,,isNum]) => { r[k] = String(r[k]??'').trim(); if (isNum && r[k]!=='') r[k] = String(num(r[k])); });
    if (isNew) list.push(r); else list[list.findIndex(x=>x.id===r.id)] = r;
    save(); App.closeM(); render(); toast('저장했습니다');
  },
  edel(){
    if (!confirm('이 줄을 지울까요?')) return;
    const {kind, r} = S.e; S.D[kind] = S.D[kind].filter(x=>x.id!==r.id); save(); App.closeM(); render();
  },

  async syncLoad(){
    if (!USE_FB) return toast('파이어베이스를 연결한 뒤에 쓸 수 있습니다');
    toast('구글시트를 읽는 중...');
    try { S.sync = await readSheet(); render(); toast('다 읽었습니다. 아래 표를 확인하고 바꾸기를 누르세요'); }
    catch(e){
      console.error(e);
      if (e.code==='auth/popup-closed-by-user' || e.code==='auth/cancelled-popup-request') return toast('구글 창을 닫아서 취소했습니다');
      if (e.code==='auth/popup-blocked') return toast('팝업이 막혔습니다. 브라우저에서 팝업을 허용해 주세요');
      alert('불러오지 못했습니다.\n\n' + (e.message || e.code || e));
    }
  },
  syncCancel(){ S.sync = null; render(); },
  syncSave(){
    const Y = S.sync; if (!Y) return;
    const msg = Y.tabs.map(t=>`· ${t.title}: ${S.D[t.kind].length}줄 → ${t.ok.length}줄`).concat(Y.custom.map(c=>`· ${c.name}: ${c.rows.length}줄 (기타 자료)`)).join('\n');
    if (!confirm(`${S.year}학년도 자료를 시트 내용으로 바꿀까요?\n\n${msg}\n\n앱에서 직접 고친 내용은 시트 내용으로 덮어씁니다.`)) return;
    S.D.xcols = S.D.xcols || {};
    Y.tabs.forEach(t => {
      S.D[t.kind] = t.ok.map(r=>{ const x={...r}; delete x._err; return x; });
      S.D.xcols[t.kind] = t.rows.extras || [];
    });
    S.D.custom = S.D.custom || [];
    Y.custom.forEach(c => {
      const old = S.D.custom.find(x=>x.name===c.name);
      const rec = {id: old?old.id:uid(), name:c.name, cols:c.cols, rows:c.rows.map(r=>({c:r}))};
      if (old) Object.assign(old, rec); else S.D.custom.push(rec);
    });
    save(); S.sync = null; S.tab = 'classes'; render(); toast('시트 내용으로 바꿨습니다');
  },

  impKind(k){ S.imp.kind = k; S.imp.rows = null; render(); },
  impName(v){ S.imp.name = v; },
  customSave(){
    const I = S.imp, name = (I.name||'').trim();
    if (!name) return toast('표 이름을 넣어 주세요');
    const t = parseCustom(I.text); if (!t) return toast('붙여 넣은 내용이 없습니다');
    S.D.custom = S.D.custom || [];
    const old = S.D.custom.find(c=>c.name===name);
    if (old && !confirm(`이미 있는 [${name}] 표를 새 자료로 바꿀까요?`)) return;
    const rec = {id: old?old.id:uid(), name, cols:t.cols, rows:t.rows.map(r=>({c:r}))};  // 줄마다 {c:[...]} (저장 형식 때문)
    if (old) Object.assign(old, rec); else S.D.custom.push(rec);
    save(); I.text=''; I.rows=null; I.name=''; S.tab='custom'; render(); toast(`[${name}] 표를 저장했습니다`);
  },
  delCustom(id){ const c = S.D.custom.find(x=>x.id===id); if (!confirm(`[${c.name}] 표를 지울까요?`)) return; S.D.custom = S.D.custom.filter(x=>x.id!==id); save(); render(); },
  impMode(m){ S.imp.mode = m; render(); },
  impText(v){ S.imp.text = v; },
  impPreview(){
    if (S.imp.kind==='custom'){ const t = parseCustom(S.imp.text); S.imp.rows = t ? Object.assign([], {custom:t}) : null; if(!t) toast('붙여 넣은 내용이 없습니다'); return render(); }
    S.imp.rows = parsePaste(S.imp.text, S.imp.kind); if (!S.imp.rows.length) toast('붙여 넣은 내용이 없습니다'); render(); },
  impSave(){
    const I = S.imp;
    if (I.kind==='custom') return App.customSave();
    const ok = I.rows.filter(r=>!r._err).map(r=>{ const x={...r}; delete x._err; return x; });
    const name = SCHEMA[I.kind].name;
    if (I.mode==='replace' && S.D[I.kind].length && !confirm(`지금 있는 ${name} 자료 ${S.D[I.kind].length}줄을 지우고 새 자료 ${ok.length}줄로 바꿀까요?`)) return;
    S.D[I.kind] = I.mode==='replace' ? ok : S.D[I.kind].concat(ok);
    S.D.xcols = S.D.xcols || {};
    S.D.xcols[I.kind] = I.mode==='replace' ? (I.rows.extras||[]) : [...new Set([...(S.D.xcols[I.kind]||[]), ...(I.rows.extras||[])])];
    save(); I.rows = null; I.text = ''; toast(`${name} 자료 ${ok.length}줄을 넣었습니다`);
    S.tab = {teachers:'teachers', classes:'classes', lessons:'lessons', duties:'duties'}[I.kind]; render();
  },
  copyOut(){
    if (S.imp.kind==='custom') return toast('기타 자료 탭에서 표를 확인하세요');
    const sc = SCHEMA[S.imp.kind];
    const X = xh(S.imp.kind);
    const tsv = [sc.cols.map(c=>c[1]).concat(X).join('\t'), ...S.D[S.imp.kind].map(r=>sc.cols.map(c=>r[c[0]]??'').concat(X.map(h=>(r.x||{})[h]??'')).join('\t'))].join('\n');
    navigator.clipboard.writeText(tsv).then(()=>toast('복사했습니다. 구글시트 A1 칸에 붙여넣기 하세요'), ()=>{ S.imp.text = tsv; render(); toast('아래 칸의 글을 직접 복사하세요'); });
  },
  async copyYear(y){
    const d = await getYear(y);
    if (!d) return toast(`${y}학년도 자료가 없습니다`);
    if (!confirm(`${y}학년도 자료를 ${S.year}학년도로 가져올까요? 지금 ${S.year}학년도 자료는 바뀝니다.`)) return;
    S.D = {...empty(), ...JSON.parse(JSON.stringify(d))}; delete S.D.updated; save(); render(); toast('가져왔습니다');
  }
};

// =====================================================================
// ⑨ 시작
// =====================================================================
if (USE_FB) initFirebase().catch(e => { $('#app').innerHTML = `<p class="empty">파이어베이스 연결 오류<br>${esc(e.message)}</p>`; });
else { loadYear(S.year).then(render); }
</script>
</body>
